<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>حاسبة إنتاج قسم الليزر</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-2: #f8f9fb;
      --line: #e2e5ea;
      --text: #1a1d23;
      --text-dim: #6b7280;
      --laser: #f97316;
      --laser-dim: rgba(249, 115, 22, 0.12);
      --denim: #3b82f6;
      --denim-dim: rgba(59, 130, 246, 0.12);
      --danger: #ef4444;
      --danger-dim: rgba(239, 68, 68, 0.12);
      --ok: #10b981;
      --radius: 16px;
      --font-display: 'Segoe UI Semibold', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-mono: 'SF Mono', 'Consolas', 'Courier New', monospace;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 4px 20px rgba(0, 0, 0, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px 60px;
      max-width: 720px;
      margin-inline: auto;
      line-height: 1.6;
    }
    .header-block { text-align: center; margin-bottom: 28px; }
    .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: var(--laser); margin: 0 0 8px; text-transform: uppercase; }
    h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin: 0; color: var(--text); }
    .laser-line { height: 3px; width: 0%; margin: 16px auto 0; background: linear-gradient(90deg, transparent, var(--laser), transparent); animation: sweep 1.1s cubic-bezier(.2,.8,.2,1) forwards; border-radius: 3px; }
    @keyframes sweep { to { width: 90%; } }
    @media (prefers-reduced-motion: reduce) { .laser-line { animation: none; width: 90%; } }
    label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 6px; font-weight: 500; }
    input, select { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; font-size: 15px; background: #fff; color: var(--text); font-family: inherit; transition: all .2s ease; }
    input::placeholder { color: #9ca3af; }
    input:focus, select:focus { outline: none; border-color: var(--laser); box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15); }
    input[type="time"] { color-scheme: light; }
    .card { background: var(--panel); border-radius: var(--radius); border: 1px solid var(--line); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .row-gap { margin-bottom: 16px; }
    .section-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin: 0 0 16px; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .section-title::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--laser); box-shadow: 0 0 10px var(--laser); flex-shrink: 0; }
    .elapsed { font-size: 13px; color: var(--text-dim); margin: 12px 0 0; font-family: var(--font-mono); }
    .elapsed b { color: var(--laser); font-weight: 600; }
    .machine-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; position: relative; overflow: hidden; box-shadow: var(--shadow); transition: box-shadow .2s ease; }
    .machine-card:hover { box-shadow: var(--shadow-lg); }
    .machine-card::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, var(--denim), var(--laser)); }
    .machine-title { font-family: var(--font-mono); font-size: 14px; font-weight: 700; letter-spacing: 1px; margin: 0 0 14px; color: var(--denim); display: flex; align-items: center; gap: 10px; }
    .machine-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--denim); box-shadow: 0 0 8px var(--denim); }
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .down-row { display: flex; gap: 8px; }
    .down-row input { width: 100%; }
    .divider { height: 1px; background: var(--line); margin: 18px 0; border: none; }
    .field-group-title { font-size: 13px; color: var(--text-dim); font-weight: 600; margin: 0 0 12px; }
    .secToggleBtn { width: 100%; height: 44px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-size: 14px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-top: 6px; border-radius: 10px; transition: all .2s ease; cursor: pointer; }
    .secToggleBtn:hover { background: #f0f2f5; }
    .secToggleVal { font-family: var(--font-mono); color: var(--text); display: flex; align-items: center; gap: 8px; }
    .secToggleVal .chev { color: var(--denim); transition: transform .2s ease; font-size: 16px; }
    .secToggleBtn.open .chev { transform: rotate(90deg); }
    .secPanel { display: none; background: var(--panel-2); border: 1px solid var(--line); border-top: none; border-radius: 0 0 10px 10px; padding: 16px; margin-bottom: 6px; }
    .secPanel.open { display: block; animation: slideDown .25s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .client-entry { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .client-entry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .client-entry input { height: 42px; font-size: 14px; }
    .client-entry-foot { display: flex; gap: 8px; align-items: center; }
    .client-entry-foot input { flex: 1; }
    .removeClientBtn { height: 42px; width: 46px; min-width: 46px; padding: 0; background: var(--danger-dim); color: var(--danger); font-size: 20px; line-height: 1; border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: all .2s ease; }
    .removeClientBtn:hover { background: var(--danger); color: #fff; }
    button { height: 48px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s ease; }
    button:active { transform: scale(0.98); }
    #calcBtn { width: 100%; background: var(--laser); color: #fff; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3); }
    #calcBtn:hover { background: #ea580c; }
    #printBtn { width: 100%; background: transparent; color: var(--denim); border: 1px solid var(--denim); }
    #printBtn:hover { background: var(--denim-dim); }
    .addClientBtn { height: 42px; font-size: 14px; background: transparent; color: var(--denim); width: 100%; border: 1px dashed var(--denim); margin-top: 4px; border-radius: 8px; cursor: pointer; transition: all .2s ease; }
    .addClientBtn:hover { background: var(--denim-dim); }
    .shift-badge { font-family: var(--font-mono); font-size: 13px; color: var(--laser); background: var(--laser-dim); display: inline-block; padding: 6px 16px; border-radius: 20px; margin: 0 0 14px; }
    .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px; text-align: center; box-shadow: var(--shadow); }
    .stat-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .stat-value { font-family: var(--font-mono); font-size: 34px; font-weight: 700; color: var(--laser); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--line); }
    th { color: var(--text-dim); font-weight: 600; font-size: 12px; }
    td:first-child, th:first-child { text-align: right; }
    td { color: var(--text); }
    tr:last-child td { border-bottom: none; }
    .footer-note { text-align: center; font-size: 11px; color: #9ca3af; margin-top: 24px; font-family: var(--font-mono); letter-spacing: 0.5px; }
    .save-indicator { position: fixed; top: 16px; left: 16px; background: var(--ok); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .3s ease; z-index: 100; }
    .save-indicator.show { opacity: 1; }
    @media (max-width: 480px) {
      .grid3 { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
      .results-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="save-indicator" id="saveIndicator">✓ تم الحفظ</div>

  <div class="header-block">
    <p class="eyebrow">قسم الليزر · لوحة تحكم الإنتاج</p>
    <h1>حاسبة إنتاج الليزر</h1>
    <div class="laser-line"></div>
  </div>

  <div class="card">
    <div class="row-gap">
      <label>الوردية</label>
      <select id="shiftPreset">
        <option value="10-morning">نظام 10 ساعات - صباحي (8 ص - 6 م)</option>
        <option value="10-evening">نظام 10 ساعات - مسائي (6 م - 4 ص)</option>
        <option value="12-morning">نظام 12 ساعة - صباحي (8 ص - 8 م)</option>
        <option value="12-evening">نظام 12 ساعة - مسائي (8 م - 8 ص)</option>
      </select>
    </div>
    <div class="grid3 row-gap">
      <div><label>بدأ الشغل</label><input type="time" id="startTime" value="08:00"></div>
      <div><label>نهاية الوردية المفروضة</label><input type="time" id="shiftEndTime" value="18:00"></div>
      <div><label>خروج العمال الفعلي</label><input type="time" id="actualEndTime" value="18:00"></div>
    </div>
    <p class="elapsed">زمن الوردية: <b id="shiftDurationLabel">-</b> | الخروج المبكر: <b id="earlyLeaveLabel">-</b> | الزمن الفعلي: <b id="elapsedLabel">-</b></p>
  </div>

  <div class="card">
    <p class="section-title">الماكينات</p>
    <div id="machines"></div>
  </div>

  <button id="calcBtn">احسب الإنتاج</button>
  <button id="printBtn">طباعة التقرير</button>

  <div id="results" style="display:none;">
    <p class="shift-badge" id="shiftLabel"></p>
    <div class="results-grid">
      <div class="stat"><div class="stat-label">إجمالي البناطيل</div><div class="stat-value" id="totalPants">-</div></div>
      <div class="stat"><div class="stat-label">الإنتاج بالساعة</div><div class="stat-value" id="perHour">-</div></div>
    </div>
    <div class="card"><table id="detailTable"></table></div>
  </div>

  <div id="clientResults" style="display:none;">
    <div class="card">
      <p class="section-title">تفصيل حسب العميل (الإنتاج الفعلي بعد خصم التوقفات)</p>
      <table id="clientDetailTable"></table>
    </div>
  </div>

  <p class="footer-note">قسم الليزر — لوحة تحكم الإنتاج اليومي</p>

  <script>
    (function() {
      const machineDefaults = [32, 41, 30, 55];
      const machinesEl = document.getElementById('machines');
      const STORAGE_KEY = 'laser_production_data';

      // ============ حفظ تلقائي ============
      function saveState() {
        const state = {
          shiftPreset: document.getElementById('shiftPreset').value,
          startTime: document.getElementById('startTime').value,
          shiftEndTime: document.getElementById('shiftEndTime').value,
          actualEndTime: document.getElementById('actualEndTime').value,
          machines: []
        };

        document.querySelectorAll('.machine-card').forEach((card, i) => {
          const machineData = {
            secInput: card.querySelector('.secInput').value,
            restFrom: card.querySelector('.restFrom').value,
            gasFrom: card.querySelector('.gasFrom').value,
            sizeInput: card.querySelector('.sizeInput').value,
            downFrom: card.querySelector('.downFrom').value,
            downTo: card.querySelector('.downTo').value,
            reasonInput: card.querySelector('.reasonInput').value,
            clients: []
          };

          card.querySelectorAll('.client-entry').forEach(entry => {
            machineData.clients.push({
              name: entry.querySelector('.clientName').value,
              legSec: entry.querySelector('.clientLegSec').value,
              from: entry.querySelector('.clientFrom').value,
              to: entry.querySelector('.clientTo').value
            });
          });

          state.machines.push(machineData);
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        
        const indicator = document.getElementById('saveIndicator');
        indicator.classList.add('show');
        clearTimeout(indicator._timeout);
        indicator._timeout = setTimeout(() => indicator.classList.remove('show'), 1500);
      }

      function loadState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return false;
        
        try {
          const state = JSON.parse(saved);
          
          document.getElementById('shiftPreset').value = state.shiftPreset || '10-morning';
          document.getElementById('startTime').value = state.startTime || '08:00';
          document.getElementById('shiftEndTime').value = state.shiftEndTime || '18:00';
          document.getElementById('actualEndTime').value = state.actualEndTime || '18:00';

          document.querySelectorAll('.machine-card').forEach((card, i) => {
            const machineData = state.machines[i];
            if (!machineData) return;

            card.querySelector('.secInput').value = machineData.secInput;
            card.querySelector('.restFrom').value = machineData.restFrom;
            card.querySelector('.gasFrom').value = machineData.gasFrom;
            card.querySelector('.sizeInput').value = machineData.sizeInput;
            card.querySelector('.downFrom').value = machineData.downFrom;
            card.querySelector('.downTo').value = machineData.downTo;
            card.querySelector('.reasonInput').value = machineData.reasonInput;

            const clientList = card.querySelector('.client-list');
            clientList.innerHTML = '';
            machineData.clients.forEach(client => {
              const row = document.createElement('div');
              row.className = 'client-entry';
              row.innerHTML = `
                <div class="client-entry-grid">
                  <input type="text" class="clientName" placeholder="اسم العميل" value="${client.name || ''}">
                  <input type="number" class="clientLegSec" placeholder="زمن الجنب (ث)" value="${client.legSec || ''}" min="1">
                </div>
                <div class="client-entry-foot">
                  <input type="time" class="clientFrom" value="${client.from || ''}">
                  <input type="time" class="clientTo" value="${client.to || ''}">
                  <button type="button" class="removeClientBtn">×</button>
                </div>
              `;
              clientList.appendChild(row);
            });
            updateClientCountLabel(i);
          });

          return true;
        } catch(e) {
          console.error('Error loading state:', e);
          return false;
        }
      }

      // ============ إنشاء الماكينات ============
      machineDefaults.forEach((val, i) => {
        const div = document.createElement('div');
        div.className = 'machine-card';
        div.innerHTML = `
          <p class="machine-title"><span class="dot"></span>ماكينة ${i+1}</p>
          <button type="button" class="secToggleBtn" data-idx="${i}" data-type="client">
            <span>العملاء</span>
            <span class="secToggleVal clientCountLabel" data-idx="${i}">مفيش عملاء<span class="chev">›</span></span>
          </button>
          <div class="secPanel" data-idx="${i}" data-type="client">
            <label>العملاء اللي اشتغلوا على الماكينة دي (بزمن جنب خاص بكل عميل)</label>
            <div class="client-list" data-machine="${i}"></div>
            <button type="button" class="addClientBtn" data-machine="${i}">+ ضيف عميل</button>
          </div>
          <button type="button" class="secToggleBtn" data-idx="${i}" data-type="leg">
            <span>زمن الجنب الأساسي</span>
            <span class="secToggleVal">${val} ث<span class="chev">›</span></span>
          </button>
          <div class="secPanel" data-idx="${i}" data-type="leg">
            <label>زمن الجنب الأساسي (ثانية)</label>
            <input type="number" class="secInput" data-idx="${i}" data-prev-val="${val}" value="${val}" min="1" />
          </div>
          <hr class="divider" />
          <p class="field-group-title">توقفات ماكينة ${i+1}</p>
          <div class="field"><label>بداية الراحة (تلقائي +30 دقيقة)</label><input type="time" class="restFrom" data-idx="${i}" /></div>
          <div class="field"><label>بداية سحب الغاز (تلقائي +10 دقائق)</label><input type="time" class="gasFrom" data-idx="${i}" /></div>
          <div class="field"><label>تغيير مقاسات (دقيقة) - تتوزع بالنسبه</label><input type="number" class="sizeInput" data-idx="${i}" value="10" min="0"></div>
          <div class="field">
            <label>عطل طارئ من الساعة - لغاية الساعة</label>
            <div class="down-row">
              <input type="time" class="downFrom" data-idx="${i}" />
              <input type="time" class="downTo" data-idx="${i}" />
            </div>
          </div>
          <div class="field"><label>سبب العطل</label><input type="text" class="reasonInput" data-idx="${i}" placeholder="مثال: صيانة، عطل كهرباء"></div>
        `;
        machinesEl.appendChild(div);
      });

      // ============ مزامنة الراحة ============
      document.addEventListener('input', (e) => {
        if (e.target.classList.contains('restFrom')) {
          const value = e.target.value;
          document.querySelectorAll('.restFrom').forEach(inp => { if (inp !== e.target) inp.value = value; });
        }
        // حفظ تلقائي عند أي تغيير
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
          saveState();
        }
      });

      document.addEventListener('change', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
          saveState();
        }
      });

      // ============ تحديث عداد العملاء ============
      function updateClientCountLabel(machineIdx) {
        const list = machinesEl.querySelector(`.client-list[data-machine="${machineIdx}"]`);
        const count = list ? list.querySelectorAll('.client-entry').length : 0;
        const label = machinesEl.querySelector(`.clientCountLabel[data-idx="${machineIdx}"]`);
        if (label) label.innerHTML = `${count > 0 ? count + ' عميل' : 'مفيش عملاء'}<span class="chev">›</span>`;
      }

      // ============ إضافة عميل ============
      function addClientRow(machineIdx) {
        const list = machinesEl.querySelector(`.client-list[data-machine="${machineIdx}"]`);
        const machineSecInput = machinesEl.querySelectorAll('.secInput')[machineIdx];
        const machineSec = machineSecInput ? machineSecInput.value : '';
        const shiftEnd = document.getElementById('actualEndTime').value || document.getElementById('shiftEndTime').value;
        let shiftStart = document.getElementById('startTime').value;
        const existingClients = list.querySelectorAll('.client-entry');
        if (existingClients.length > 0) {
          const lastClient = existingClients[existingClients.length - 1];
          const lastClientTo = lastClient.querySelector('.clientTo').value;
          if (lastClientTo) shiftStart = lastClientTo;
        }
        const row = document.createElement('div');
        row.className = 'client-entry';
        row.innerHTML = `
          <div class="client-entry-grid">
            <input type="text" class="clientName" placeholder="اسم العميل">
            <input type="number" class="clientLegSec" placeholder="زمن الجنب (ث)" value="${machineSec}" min="1">
          </div>
          <div class="client-entry-foot">
